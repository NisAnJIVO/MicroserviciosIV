services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: practica3
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  mongo:
    image: mongo:7
    volumes: ["datos-practica3:/data/db"]

  consumidor:
    build: ./consumidor
    ports: ["3001:3001"]
    environment:
      PORT: 3001
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  datos-practica3:
